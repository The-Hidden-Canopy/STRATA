[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
version = "0.1.0"
description = "A local-first spatial-temporal evidence and reconstruction engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "The Hidden Canopy" }]
dependencies = []

[project.scripts]
strata = "strata.cli:main"
bundle = "bundle.cli:main"

[tool.setuptools.packages.find]
include = ["bundle*", "strata*"]

[tool.setuptools.package-data]
strata = ["frontend/*"]

[tool.bundle]
schema-version = "bundle-project-1"

[tool.strata]
format-major = 1
format-minor = 0
